# Pre-commit hooks for this repo. Install once per clone:
#   pip install pre-commit --break-system-packages   # or: brew install pre-commit
#   pre-commit install
#
# Then every `git commit` runs these automatically. Run against everything manually with:
#   pre-commit run --all-files
#
# This exists so the fmt/lint/security issues that show up in CI show up on your machine
# first, before you push and wait on a run — the CI workflow is the backstop for anyone who
# skips this or doesn't have it installed, not the primary feedback loop.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--config-file=.checkov.yaml
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
