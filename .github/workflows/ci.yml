name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt-and-validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend) and validate — modules
        run: |
          for dir in modules/*/; do
            echo "== Validating $dir =="
            (cd "$dir" && terraform init -backend=false && terraform validate)
          done

      - name: Terraform init (no backend) and validate — landing-zone
        run: |
          cd landing-zone
          terraform init -backend=false
          terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init tflint plugins
        run: tflint --init

      - name: Run tflint on each module and the landing zone
        run: |
          for dir in modules/*/ landing-zone/; do
            echo "== Linting $dir =="
            (cd "$dir" && tflint --format compact)
          done

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
