name: Terraform CI & Security Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly scan even with no code changes — catches newly disclosed CVEs/misconfig rules
    # in the scanners themselves, and new secret-scanning signatures.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fmt-and-validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend) and validate — modules
        run: |
          for dir in modules/*/; do
            echo "== Validating $dir =="
            (cd "$dir" && terraform init -backend=false && terraform validate)
          done

      - name: Terraform init (no backend) and validate — landing-zone
        run: |
          cd landing-zone
          terraform init -backend=false
          terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init tflint plugins
        run: tflint --init

      - name: Run tflint on each module and the landing zone
        run: |
          for dir in modules/*/ landing-zone/; do
            echo "== Linting $dir =="
            (cd "$dir" && tflint --format compact)
          done

  terraform-docs-check:
    name: terraform-docs (README freshness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://terraform-docs.io/dl/v0.19.0/terraform-docs-v0.19.0-$(uname | tr '[:upper:]' '[:lower:]')-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: Regenerate docs and check for drift
        run: |
          for dir in modules/*/ landing-zone/ bootstrap/; do
            terraform-docs --config .terraform-docs.yml "$dir"
          done
          if ! git diff --exit-code -- '**/README.md'; then
            echo "::error::Generated docs are out of date. Run 'pre-commit run terraform_docs --all-files' locally and commit the result."
            exit 1
          fi

  checkov:
    name: checkov (policy-as-code)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          config_file: .checkov.yaml
          soft_fail: false

      - name: Upload Checkov SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  trivy-config:
    name: trivy (misconfig scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy config scan (human-readable log output + build gate)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "1" # this step's severity filtering is reliable — it gates the build

      - name: Run Trivy config scan (SARIF for Security tab)
        # Always runs, even if the step above failed the job, so the Security tab still gets
        # populated. exit-code is "0" here deliberately: Trivy's SARIF builder ignores the
        # severity filter for its own exit-code decision (it evaluates all severities, not just
        # the ones passed via `severity`), so this step can't be trusted to gate the build — the
        # table step above is the real, severity-accurate gate.
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-config

  terrascan:
    name: terrascan (policy compliance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Terrascan
        id: terrascan
        uses: tenable/terrascan-action@v1.5.0
        with:
          iac_type: terraform
          iac_dir: .
          policy_type: aws
          only_warn: false
          sarif_upload: true

      - name: Upload Terrascan SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: terrascan.sarif
          category: terrascan

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  infracost:
    name: infracost (cost estimate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Requires a free API key from https://www.infracost.io/ stored as the INFRACOST_API_KEY
      # repo secret. Without it, this job is skipped entirely rather than failing the build —
      # cost estimation is a nice-to-have, not a merge gate.
      - name: Check for Infracost API key
        id: check_key
        run: |
          if [ -n "${{ secrets.INFRACOST_API_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Infracost
        if: steps.check_key.outputs.has_key == 'true'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout base branch
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.base.ref }}"
          path: base

      - name: Generate Infracost cost baseline
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          infracost breakdown --path=base/landing-zone \
            --terraform-var-file=terraform.tfvars.example \
            --terraform-init-flags="-backend=false" \
            --format=json --out-file=infracost-base.json

      - name: Checkout PR branch
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Generate Infracost cost diff
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          infracost diff --path=pr/landing-zone \
            --terraform-var-file=terraform.tfvars.example \
            --terraform-init-flags="-backend=false" \
            --format=json --compare-to=infracost-base.json \
            --out-file=infracost-diff.json

      - name: Post cost estimate comment
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          infracost comment github --path=infracost-diff.json \
            --repo="$GITHUB_REPOSITORY" \
            --github-token="${{ github.token }}" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --behavior=update
