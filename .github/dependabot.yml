version: 2
updates:
  # Keep GitHub Actions pinned versions current (e.g. checkov-action, trivy-action, etc. in
  # .github/workflows/ci.yml). Supply-chain hygiene for CI itself, not just the infrastructure code.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Terraform provider version constraints — one entry per root/module directory since
  # Dependabot's terraform ecosystem scans each directory independently.
  - package-ecosystem: "terraform"
    directory: "/landing-zone"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "terraform"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/modules/account-baseline"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "terraform"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/modules/s3-secure-bucket"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "terraform"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/modules/iam-identity-center-permission-set"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "terraform"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/modules/vpc-baseline"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "terraform"
      include: "scope"
